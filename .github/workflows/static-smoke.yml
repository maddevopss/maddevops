name: Static site smoke

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/copilot-instructions.md"
  push:
    branches: [main]
    paths-ignore:
      - ".github/copilot-instructions.md"

permissions:
  contents: read

jobs:
  smoke:
    name: Static site smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -f index.html
          test -f contact.html
          test -f img/logo.png
          test -f assets/js/tracking.js
          test -f assets/js/contact-form.js

      - name: Validate basic HTML metadata
        run: |
          grep -q 'lang="fr-CA"' index.html
          grep -q 'name="viewport"' index.html
          grep -q '<title>' index.html
          grep -q 'name="description"' index.html
          grep -q 'lang="fr-CA"' contact.html
          grep -q 'name="viewport"' contact.html
          grep -q '<title>' contact.html
          grep -q 'name="description"' contact.html
          grep -q 'class="skip-link"' contact.html
          grep -q 'id="main-content"' contact.html

      - name: Validate privacy-light tracking
        run: |
          grep -q 'function trackEvent' assets/js/tracking.js
          grep -q 'window.dataLayer' assets/js/tracking.js
          if grep -q 'cta_text' assets/js/tracking.js; then
            echo 'cta_text should not be tracked'
            exit 1
          fi

      - name: Validate contact form safety
        run: |
          if grep -q 'innerHTML' contact.html assets/js/contact-form.js; then
            echo 'contact form should not use innerHTML'
            exit 1
          fi
          grep -q 'aria-live' assets/js/contact-form.js

      - name: Validate PHP contact endpoint syntax
        run: php -l api/contact.php
