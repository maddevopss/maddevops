name: Static site smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: Static site smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -f index.html
          test -f contact.html
          test -f img/logo.png
          test -f tracking.js

      - name: Validate basic HTML metadata
        run: |
          grep -q 'lang="fr-CA"' index.html
          grep -q 'name="viewport"' index.html
          grep -q '<title>' index.html
          grep -q 'name="description"' index.html
          grep -q 'lang="fr-CA"' contact.html
          grep -q 'name="viewport"' contact.html
          grep -q '<title>' contact.html
          grep -q 'name="description"' contact.html
          grep -q 'class="skip-link"' contact.html
          grep -q 'id="main-content"' contact.html

      - name: Validate privacy-light tracking
        run: |
          grep -q 'function trackEvent' tracking.js
          grep -q 'window.dataLayer' tracking.js
          ! grep -q 'cta_text' tracking.js

      - name: Validate contact form safety
        run: |
          ! grep -q 'innerHTML' contact.html
          grep -q 'aria-live' contact.html
