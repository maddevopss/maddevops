server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /api/contact.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api/contact.php;
        fastcgi_param SCRIPT_NAME /api/contact.php;
        fastcgi_pass php:9000;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ \.vcf$ {
        types { } default_type text/vcard;
        add_header Content-Type "text/vcard; charset=utf-8";
    }

    location ~ /\. {
        deny all;
    }
}
