services:
  app:
    image: nginx:alpine
    container_name: maddevops-app
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./current:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - proxy-tier

  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: maddevops-php
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./current:/var/www/html:ro
    networks:
      - proxy-tier

networks:
  proxy-tier:
    external: true
